# Topoliner для RustGIS - расширение-процесс RustGIS.
# Copyright (C) 2026 ООО «Информ++». Лицензия GPL-3.0-or-later.
# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "topoliner-rustgis"
description = "Topoliner для RustGIS: топология полигональных и линейных покрытий"
# своя версия: выпуски расширения - теги rustgis-v<версия>
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["ООО «Информ++»"]
repository = "https://github.com/Valery35/topoliner-rustgis"
publish = false

[dependencies]
serde_json = "1"
# общая основа расширений RustGIS линейки, отдельное хранилище.
# Правка крейта на месте - [patch] в .cargo/config.toml или путь вместо git.
rustgis-kit = { git = "https://github.com/Valery35/rustgis-kit", tag = "v0.1.6" }
# булевы операции, корректность и внутренняя точка - тот же набор,
# что даёт GEOS модулю QGIS
geo = "0.33"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
